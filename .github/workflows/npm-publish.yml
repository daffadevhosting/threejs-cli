name: Publish to NPM

on:
  push:
    branches: [master]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Prefer optional GH_TOKEN secret; fall back to default GITHUB_TOKEN
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build package
        run: npm run build

      - name: Verify dist exists
        run: |
          test -f dist/index.js || (echo "Build failed: dist/index.js missing" && exit 1)
          head -1 dist/index.js | grep -q '#!/usr/bin/env node' || echo "Warning: shebang missing"

      - name: Conditional version bump and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Tag push / Release detected: publishing without version bump."
            npm publish --access public --provenance
          elif [[ "${{ github.ref }}" == refs/heads/master ]]; then
            echo "Master branch push detected: bumping version and publishing."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Skip if the latest commit is already a version bump
            if git log -1 --pretty=%B | grep -q '\[skip ci\]'; then
              echo "Latest commit already has [skip ci]. Skipping version bump."
            else
              npm version patch -m "ci: bump version to %s [skip ci]"
              npm publish --access public --provenance
            fi
          else
            echo "Not master or a tag. Skipping publish."
          fi

      - name: Push version changes
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if git describe --exact-match --tags HEAD 2>/dev/null; then
            git push origin master --follow-tags
          else
            echo "No new tag to push."
          fi
